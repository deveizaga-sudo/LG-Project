# XcodeGen spec for CI. It builds the same sources as HolaAmigos.swiftpm
# into a regular Xcode project so GitHub Actions can compile the app and
# run its tests. Generate locally on a Mac with: xcodegen generate
name: HolaAmigos
options:
  bundleIdPrefix: com.holaamigos
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
targets:
  HolaAmigos:
    type: application
    platform: iOS
    sources:
      - HolaAmigos.swiftpm/App
      - HolaAmigos.swiftpm/Models
      - HolaAmigos.swiftpm/Services
      - HolaAmigos.swiftpm/Views
      - HolaAmigos.swiftpm/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: HolaAmigos
        PRODUCT_BUNDLE_IDENTIFIER: com.holaamigos.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Hola Amigos
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  HolaAmigosTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/HolaAmigosTests
    dependencies:
      - target: HolaAmigos
  HolaAmigosUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/HolaAmigosUITests
    dependencies:
      - target: HolaAmigos
schemes:
  HolaAmigos:
    build:
      targets:
        HolaAmigos: all
    test:
      config: Debug
      targets:
        - HolaAmigosTests
        - HolaAmigosUITests
