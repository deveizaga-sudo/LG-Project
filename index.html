<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>LG Project Home</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Fixed 1920x1080 stage; scaled to fit the window by js/app.js -->
  <div id="stage">
    <div id="backdrop" class="backdrop"></div>

    <!-- Left navigation rail: collapsed to icons, expands while focused -->
    <nav id="rail" class="rail" aria-label="Main">
      <div class="rail__brand">
        <span class="rail__logo">LG</span>
        <span class="rail__label">Project</span>
      </div>
      <ul id="rail-items" class="rail__items"></ul>
    </nav>

    <!-- Top status bar -->
    <header class="topbar">
      <div class="topbar__greeting">
        <span id="greeting">Good evening</span>
        <span class="topbar__profile focusable" tabindex="-1" data-action="profile">
          <span class="avatar">D</span>
        </span>
      </div>
      <div class="topbar__right">
        <span class="topbar__btn focusable" tabindex="-1" data-action="search" data-icon="search"></span>
        <span class="topbar__btn focusable" tabindex="-1" data-action="notifications" data-icon="bell"></span>
        <span class="topbar__btn focusable" tabindex="-1" data-action="settings" data-icon="settings"></span>
        <time id="clock" class="topbar__clock">--:--</time>
      </div>
    </header>

    <main id="viewport" class="viewport" data-nav-clip>
      <div id="scroller" class="scroller">
        <!-- Hero: resume the last thing watched (no promoted content) -->
        <section class="hero" id="hero">
          <div class="hero__content">
            <span id="hero-tag" class="hero__tag"></span>
            <h1 id="hero-title" class="hero__title"></h1>
            <p id="hero-meta" class="hero__meta"></p>
            <p id="hero-desc" class="hero__desc"></p>
            <div class="hero__actions">
              <span class="btn btn--primary focusable" tabindex="-1" data-action="hero-play">
                <i data-icon="play"></i> Resume
              </span>
              <span class="btn focusable" tabindex="-1" data-action="hero-info">
                <i data-icon="info"></i> More info
              </span>
            </div>
          </div>
        </section>

        <!-- Content rows are rendered here -->
        <div id="rows"></div>
      </div>
    </main>

    <!-- Details modal -->
    <div id="modal" class="modal" hidden>
      <div class="modal__panel">
        <div id="modal-art" class="modal__art"></div>
        <div class="modal__body">
          <span id="modal-tag" class="hero__tag"></span>
          <h2 id="modal-title" class="modal__title"></h2>
          <p id="modal-meta" class="hero__meta"></p>
          <p id="modal-desc" class="modal__desc"></p>
          <div class="hero__actions">
            <span class="btn btn--primary focusable" tabindex="-1" data-action="modal-play">
              <i data-icon="play"></i> Play
            </span>
            <span class="btn focusable" tabindex="-1" data-action="modal-close">
              <i data-icon="back"></i> Back
            </span>
          </div>
        </div>
      </div>
    </div>

    <!-- Exit confirmation -->
    <div id="exit-dialog" class="modal" hidden>
      <div class="dialog">
        <h2>Exit the app?</h2>
        <div class="hero__actions">
          <span class="btn focusable" tabindex="-1" data-action="exit-cancel">Stay</span>
          <span class="btn btn--primary focusable" tabindex="-1" data-action="exit-confirm">Exit</span>
        </div>
      </div>
    </div>

    <div id="toast" class="toast" role="status"></div>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
