name: iOS build & test

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, test and screenshot
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick the newest iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          best = None
          for runtime, items in devices.items():
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not m:
                  continue
              version = (int(m.group(1)), int(m.group(2)))
              for d in items:
                  if d["name"].startswith("iPhone") and (best is None or version > best[0]):
                      best = (version, d["udid"], d["name"])
          print(best[1])
          print(f"Using {best[2]} (iOS {best[0][0]}.{best[0][1]})", file=sys.stderr)
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and run tests
        env:
          # Passed to the UI test as SCREENSHOT_DIR.
          TEST_RUNNER_SCREENSHOT_DIR: ${{ github.workspace }}/screenshots
        run: |
          set -o pipefail
          xcodebuild test \
            -project HolaAmigos.xcodeproj \
            -scheme HolaAmigos \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log \
            | { grep -E "error:|Test Case|Executed|\*\* (BUILD|TEST)" || true; }
          # With pipefail, a failing xcodebuild still fails this step; the
          # grep only trims the log shown here (full log is uploaded).

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: warn

      - name: Upload full log and test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            xcodebuild.log
            TestResults.xcresult
